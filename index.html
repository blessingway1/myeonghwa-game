<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="canonical" href="https://blessingway1.github.io/myeonghwa-game/">
<script data-goatcounter="https://myeonghwa.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</head>
<body style="margin:0">
<title>명화 사건파일</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: a dim gallery wall. The painting hangs on the left as the scene of the case;
   the investigator's dossier (clues, notes, verdict) sits beside it, or below it on a phone. */
:root{
  color-scheme:dark;
  --wall:#191319; --wall-2:#221a21; --panel:#2a2028; --line:#4b3b46;
  --ink:#f1e8d8; --ink-dim:#b9a999; --gilt:#d3ab55; --gilt-deep:#8f6f2c;
  --paper:#eadfc9; --paper-ink:#2a2028; --seal:#c2463a;
  --display:"Gowun Batang","Noto Serif KR","Apple SD Gothic Neo",serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--wall);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.65;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible{outline:2px solid var(--gilt);outline-offset:3px}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
.mono{font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase;font-size:11px;color:var(--ink-dim)}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;line-height:1.3}

/* ---------- home ---------- */
.masthead{display:flex;flex-wrap:wrap;gap:16px 32px;align-items:flex-end;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:18px}
.masthead h1{font-size:clamp(30px,6vw,46px);letter-spacing:-.01em}
.masthead p{margin:6px 0 0;color:var(--ink-dim);max-width:46ch}
.badge{min-width:220px;display:flex;flex-direction:column;gap:6px}
.badge b{font-family:var(--display);font-size:18px;color:var(--gilt)}
.xpbar{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--gilt);transition:width .6s}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.sec-head h2{font-size:22px}
.cases{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
.case{display:flex;flex-direction:column;text-align:left;background:var(--wall-2);border:1px solid var(--line);padding:0;transition:transform .25s,border-color .25s}
.case:hover{transform:translateY(-3px);border-color:var(--gilt-deep)}
.case .thumb{position:relative;aspect-ratio:4/3;overflow:hidden;background:#000}
.case .thumb img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.75) brightness(.72);transition:filter .4s,transform 6s}
.case:hover .thumb img{filter:none;transform:scale(1.06)}
.case.solved .thumb img{filter:none}
.case .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px}
.case h3{font-size:20px}
.case .hook{color:var(--ink-dim);font-size:14px;margin:0}
.case .meta{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:6px}
.case .meta .nw{white-space:nowrap}
.status{flex-shrink:0;white-space:nowrap;font-family:var(--mono);font-size:11px;letter-spacing:.08em;padding:3px 8px;border:1px solid var(--line);color:var(--ink-dim)}
.status.done{border-color:var(--seal);color:var(--seal)}
.stamp{position:absolute;right:10px;top:10px;font-family:var(--display);font-weight:700;color:var(--seal);border:2px solid var(--seal);padding:2px 10px;transform:rotate(8deg);background:rgba(25,19,25,.78);font-size:15px}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:14px}
.card{background:var(--paper);color:var(--paper-ink);padding:8px 8px 10px;border:0;text-align:left;display:flex;flex-direction:column;gap:6px;position:relative}
.card img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}
.card b{font-family:var(--display);font-size:14px;line-height:1.3}
.card span{font-size:11px;font-family:var(--mono);opacity:.75}
.card .rk{position:absolute;right:12px;top:12px;width:26px;height:26px;border-radius:50%;background:var(--seal);color:var(--paper);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:14px}
.card.locked{background:transparent;border:1px dashed var(--line);color:var(--ink-dim);justify-content:center;align-items:center;min-height:210px;text-align:center}
.card.locked b{font-size:30px;color:var(--line)}
.note{color:var(--ink-dim);font-size:13px;margin:0}

/* ---------- case ---------- */
.topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:12px}
.topbar h2{font-size:20px;flex:1;min-width:0}
.ghost{background:none;border:1px solid var(--line);padding:6px 12px}
.ghost:hover{border-color:var(--gilt)}
.counter{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;color:var(--gilt)}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:28px;align-items:start}
.hang{display:flex;justify-content:center;min-width:0}
.stage{--ratio:1;--cap:78vh;position:relative;width:min(100%,calc(var(--cap) * var(--ratio)));max-width:100%;aspect-ratio:var(--ratio);
  overflow:hidden;background:#000;border:10px solid #3a2a1c;outline:1px solid var(--gilt-deep);box-shadow:0 30px 60px -20px #000;cursor:crosshair;perspective:1200px;touch-action:manipulation}
.tilt,.zoom,.breathe{position:absolute;inset:0;transform-origin:0 0}
.tilt{transform-origin:50% 50%;transition:transform .3s ease-out}
.zoom{--z:1;transition:transform 1.1s cubic-bezier(.6,.05,.2,1)}
.breathe{transform-origin:50% 50%;animation:breathe 16s ease-in-out infinite alternate}
.stage.zoomed .breathe{animation-play-state:paused}
.stage.zoomed{cursor:zoom-out}
@keyframes breathe{from{transform:scale(1)}to{transform:scale(1.03) translate(-.4%,-.3%)}}
.breathe img{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}
.motes{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;mix-blend-mode:screen}
.fx{position:absolute;pointer-events:none;transform:translate(-50%,-50%);mix-blend-mode:screen}
.fx.flame{width:2.6%;aspect-ratio:1/1.9;background:radial-gradient(ellipse at 50% 68%,#fff7d6 0,#ffc65e 38%,rgba(255,130,30,0) 72%);animation:flick .21s infinite alternate ease-in-out;transform-origin:50% 100%}
.fx.halo{width:22%;aspect-ratio:1;background:radial-gradient(circle,rgba(255,196,110,.34) 0,rgba(255,170,80,0) 65%);animation:pulse 3.2s infinite alternate ease-in-out}
.fx.glint{width:var(--w,9%);aspect-ratio:var(--ar,1);background:radial-gradient(ellipse,rgba(255,244,214,.42) 0,rgba(255,244,214,0) 68%);animation:pulse 4.5s infinite alternate ease-in-out;rotate:var(--rot,0deg)}
@keyframes flick{from{transform:translate(-50%,-50%) scale(1,1) skewX(-3deg)}to{transform:translate(-50%,-50%) scale(.86,1.14) skewX(4deg)}}
@keyframes pulse{from{opacity:.25}to{opacity:1}}
.pin{position:absolute;transform:translate(-50%,-50%) scale(calc(1 / var(--z)));width:26px;height:26px;border-radius:50%;border:1.5px solid var(--gilt);background:rgba(25,19,25,.72);color:var(--gilt);font-family:var(--mono);font-size:12px;display:grid;place-items:center;padding:0}
.ring{position:absolute;transform:translate(-50%,-50%);border:2px solid var(--gilt);border-radius:50%;pointer-events:none;animation:ring 1.1s ease-out 3}
@keyframes ring{from{opacity:1;scale:.3}to{opacity:0;scale:1.25}}
.miss{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;border:1px solid var(--ink-dim);border-radius:50%;pointer-events:none;animation:ring .5s ease-out 1 forwards}
.flash{position:absolute;inset:0;background:var(--paper);opacity:0;pointer-events:none}
.flash.go{animation:flash .5s ease-out}
@keyframes flash{from{opacity:.55}to{opacity:0}}

.dossier{background:var(--panel);border:1px solid var(--line);padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.dossier h3{font-size:21px}
.brief{margin:0;color:var(--ink-dim)}
.label{display:flex;flex-direction:column;gap:2px;padding:8px 0 8px 12px;border-left:2px solid var(--gilt-deep)}
.label b{font-family:var(--display);font-size:16px;color:var(--ink)}
.label span{font-size:13px;color:var(--ink-dim)}
.label small{font-size:12px;color:var(--ink-dim);opacity:.8}
.clues{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.clues li{display:flex;gap:12px;align-items:baseline;padding:9px 12px;border:1px solid var(--line);color:var(--ink-dim)}
.clues li .n{font-family:var(--mono);font-size:12px;color:var(--gilt-deep)}
.clues li.got{color:var(--ink);border-color:var(--gilt-deep);background:rgba(211,171,85,.07);cursor:pointer}
.clues li.got .n{color:var(--gilt)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{background:var(--gilt);color:#1b1410;border:0;padding:10px 18px;font-weight:600}
.btn:hover{filter:brightness(1.08)}
.tag{display:inline-block;background:var(--paper);color:var(--paper-ink);font-family:var(--mono);font-size:11px;letter-spacing:.08em;padding:3px 9px;align-self:flex-start}
.entry{display:flex;flex-direction:column;gap:4px}
.entry .mono{color:var(--gilt)}
.entry p{margin:0}
.look{border-left:2px solid var(--gilt);padding:2px 0 2px 14px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;background:var(--wall-2);border:1px solid var(--line);padding:12px 14px}
.opt:hover{border-color:var(--gilt)}
.opt.no{animation:shake .35s;border-color:var(--seal);color:var(--ink-dim)}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* special viewers inside a clue */
.viewer{position:relative;height:200px;overflow:hidden;background:#000;border:1px solid var(--line)}
.viewer img{position:absolute;max-width:none;display:block}
.viewer.skull img{width:540px;left:calc(50% - 251px);top:calc(100px - 468px);transform-origin:46.5% 88%}
.viewer.mirror img{width:1900px;left:calc(50% - 798px);top:calc(100px - 1240px)}
.slide{display:flex;gap:12px;align-items:center;font-size:13px;color:var(--ink-dim)}
.slide input{flex:1;accent-color:var(--gilt);min-width:0}

/* ---------- verdict ---------- */
.verdict{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:32px;align-items:start}
.plate{background:var(--paper);color:var(--paper-ink);padding:12px 12px 16px;display:flex;flex-direction:column;gap:8px;position:relative;animation:drop .7s cubic-bezier(.2,1.3,.4,1) both}
@keyframes drop{from{transform:translateY(-30px) rotate(-4deg);opacity:0}to{transform:none;opacity:1}}
.plate img{width:100%;display:block}
.plate b{font-family:var(--display);font-size:18px}
.plate small{font-family:var(--mono);font-size:11px}
.seal{position:absolute;right:-10px;top:-14px;width:74px;height:74px;border-radius:50%;background:var(--seal);color:var(--paper);display:grid;place-items:center;text-align:center;font-family:var(--display);font-weight:700;line-height:1.05;transform:rotate(12deg);box-shadow:0 4px 0 rgba(0,0,0,.25)}
.seal span{font-size:28px;display:block}
.seal em{font-style:normal;font-size:10px;font-family:var(--mono)}
.report{display:flex;flex-direction:column;gap:20px;max-width:62ch}
.report h2{font-size:clamp(24px,4vw,32px)}
.report ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.scoreline{display:flex;gap:18px;flex-wrap:wrap;font-family:var(--mono);font-size:12px;color:var(--ink-dim)}
.scoreline b{color:var(--gilt);font-weight:500}

/* ---------- one-scene hunts ---------- */
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.qtile{display:flex;flex-direction:column;text-align:left;background:var(--wall-2);border:1px solid var(--line);padding:0;transition:border-color .25s}
.qtile:hover{border-color:var(--gilt)}
.qtile .thumb{aspect-ratio:16/10;overflow:hidden;background:#000}
.qtile .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.qtile .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px}
.qtile b{font-family:var(--display);font-size:16px;line-height:1.4}
#scene{display:flex;flex-direction:column;gap:18px}
.scene-wrap{display:flex;justify-content:center}
.phone{user-select:none;-webkit-user-select:none;position:relative;width:min(100%,calc(82vh * 9 / 16));aspect-ratio:9/16;background:#0e0a0e;border:1px solid var(--line);overflow:hidden;display:flex;flex-direction:column;container-type:inline-size}
.ph-q,.ph-cap{word-break:keep-all}
.ph-q{flex:0 0 23%;padding:0 6% 3%;display:flex;flex-direction:column;gap:6px;justify-content:flex-end;font-family:var(--display);font-weight:700;font-size:5.4cqw;line-height:1.35;text-wrap:balance}
.ph-q .mono{font-size:2.6cqw}
.ph-sub{font-family:var(--body);font-weight:400;font-size:3.7cqw;color:var(--gilt);min-height:1.5em}
.ph-stage{position:relative;flex:1;min-height:0;overflow:hidden;cursor:crosshair;display:grid;place-items:center;container-type:size;touch-action:manipulation}
.ph-pic{position:relative;width:min(100cqw,calc(100cqh * var(--ratio)));aspect-ratio:var(--ratio)}
.ph-zoom{position:absolute;inset:0;transition:transform 1.8s cubic-bezier(.6,.05,.2,1)}
.ph-zoom img{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}
.ph-count{position:absolute;right:5%;top:4%;font-family:var(--display);font-weight:700;font-size:44px;color:var(--gilt);text-shadow:0 2px 12px #000}
.ph-inset{position:absolute;left:4%;right:4%;bottom:5%;border:1px solid var(--gilt);background:#000;opacity:0;transition:opacity .9s;pointer-events:none}
.ph-inset.on{opacity:1}
.ph-inset img{display:block;width:100%}
.ph-inset .mono{position:absolute;left:6px;bottom:4px;font-size:9px;color:var(--paper);text-shadow:0 1px 3px #000}
.ph-cap{flex:0 0 21%;padding:4% 6% 0;display:flex;flex-direction:column;gap:6px;font-size:4.1cqw;line-height:1.5}
.ph-cap p{margin:0;opacity:0;transform:translateY(8px);transition:opacity .5s,transform .5s}
.ph-cap p.on{opacity:1;transform:none}
.ph-cap p.old{opacity:.38;transform:none;font-size:.86em}
.ring.stay{border-width:3px;box-shadow:0 0 0 2px rgba(0,0,0,.55),0 0 18px rgba(211,171,85,.7);animation:stay 1s ease-in-out infinite alternate}
@keyframes stay{from{opacity:.55;scale:.9}to{opacity:1;scale:1.06}}
.row.center{justify-content:center}
.note.center{text-align:center}
.viewer.note{height:auto}
.viewer.note img{position:static;width:100%}

/* ---------- stats ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.tiles div{background:var(--wall-2);padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.tiles b{font-family:var(--display);font-size:28px;color:var(--gilt);font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:9px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-family:var(--mono);font-size:11px;font-weight:400;color:var(--ink-dim);letter-spacing:.04em}
th:first-child,td:first-child{text-align:left}
tbody tr:last-child td{border-bottom:0}
#stats{display:flex;flex-direction:column;gap:20px}

@media (max-width:880px){
  .grid{grid-template-columns:minmax(0,1fr)}
  .stage{--cap:58vh;border-width:6px}
  .verdict{grid-template-columns:minmax(0,1fr)}
  .plate{max-width:300px}
}
@media (prefers-reduced-motion:reduce){
  .breathe,.fx,.ring,.ring.stay,.plate{animation:none}
  .ph-zoom{transition:none}
  .zoom,.tilt{transition:none}
}
</style>

<div class="wrap">
  <section id="home"></section>
  <section id="case" hidden></section>
  <section id="verdict" hidden></section>
  <section id="stats" hidden></section>
  <section id="scene" hidden></section>
</div>

<script>
const CASES = [
{
  id:'arnolfini', no:'CASE 01', img:'img/arnolfini.jpg', ratio:1920/2646,
  name:'벽에 이름을 남긴 목격자',
  work:'아르놀피니 부부의 초상', artist:'얀 반 에이크', year:'1434',
  place:'런던 내셔널 갤러리 · 오크 패널에 유채 · 82 × 60 cm',
  hook:'두 사람이 손을 맞잡은 방. 그런데 이 방에는 두 사람만 있던 것이 아니다.',
  brief:'1434년 브뤼헤, 부유한 상인의 방. 남자는 손을 들고 여자는 손을 내민다. 방 안 물건들이 저마다 무언가를 말하고 있다. 그림을 눌러 단서 다섯 개를 찾아라.',
  fx:[{k:'halo',x:41.9,y:6.2},{k:'flame',x:41.9,y:5.7},{k:'glint',x:50.4,y:29.5,w:'7%'}],
  clues:[
    {x:47.5,y:21.6,r:7,z:3.2,riddle:'누군가 벽에 글씨를 남겼다',title:'벽의 서명',
     found:'거울 위 벽에 라틴어로 "Johannes de eyck fuit hic 1434"라고 적혀 있다. "얀 반 에이크가 여기 있었다, 1434년"이라는 뜻이다.',
     behind:'당시 화가들은 보통 "누가 그렸다"고 서명했다. 반 에이크는 "여기 있었다"고 썼다. 서명이라기보다 현장에 있었다는 증언에 가깝고, 글씨도 공증 문서를 떠올리게 하는 장식 서체다.',
     look:'그림 속 글자는 화가가 직접 남긴 말이다. 글자가 보이면 장식으로 넘기지 말고 먼저 읽어 보자.'},
    {x:50.4,y:29.5,r:6.5,z:4.2,riddle:'방 안에 눈이 하나 더 있다',title:'볼록 거울',
     found:'거울에는 부부의 뒷모습과 함께 문간에 선 두 사람이 더 비친다. 한 명은 파란 옷, 한 명은 붉은 옷이다.',
     behind:'둘 중 한 명이 화가 자신이라는 해석이 유력하다. 바로 위의 서명과 짝을 이룬다. 거울 테두리의 작은 원 열 개에는 그리스도의 수난 장면이 들어 있다. 발치의 강아지는 거울 속에 없다.',
     look:'거울, 창, 유리잔 같은 반사면을 찾자. 화가는 그림 바깥의 세계를 그 안에 숨겨 둔다.'},
    {x:41.9,y:6.3,r:6.5,z:3.6,riddle:'대낮인데 켜져 있는 것',title:'한 자루의 촛불',
     found:'창으로 햇빛이 드는 한낮인데 샹들리에에 촛불이 하나만 켜져 있다. 남자 쪽이다.',

function sceneRing(stay){const k=S.sc,r=document.createElement('i');r.className=stay?'ring stay':'ring';r.style.cssText=`left:${k.x}%;top:${k.y}%;width:${k.r*1.8}%;aspect-ratio:1`;$('#phzoom').appendChild(r);if(!stay)setTimeout(()=>r.remove(),3400)}

let P=null, raf=0, tick=0;

  stopPlay();

function clock(){if(!P)return;const s=Math.floor((Date.now()-P.t0)/1000);$('#clock').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
  $('#count').textContent=`단서 ${P.found.length}/${P.c.clues.length}`}
function onTilt(e){if(e.pointerType!=='mouse'||P.open>=0)return;const r=e.currentTarget.getBoundingClientRect();
  const dx=(e.clientX-r.left)/r.width-.5,dy=(e.clientY-r.top)/r.height-.5;

  if(!k){z.style.transform='';z.style.setProperty('--z',1);st.classList.remove('zoomed');return}
  const cl=(v,lo)=>Math.min(0,Math.max(lo,v)),s=k.z;
  z.style.transform=`translate(${cl(50-k.x*s,100-100*s)}%,${cl(50-k.y*s,100-100*s)}%) scale(${s})`;

function onTap(e){
  if(!P)return; const pin=e.target.closest('.pin'); if(pin) return openClue(+pin.dataset.i);

    <div class="row"><button class="ghost" id="hint">힌트 보기</button><span class="note">힌트를 쓰면 등급이 내려간다 · 사용 ${P.hints}회</span></div>`;

}
function score(p){const sec=(Date.now()-p.t0)/1000;
  return Math.max(20,Math.round(100-p.hints*12-Math.max(0,p.misses-4)*2-p.wrong*10-Math.min(20,Math.max(0,sec-240)/15)))}
function finish(){const p=P,c=p.c,sc=score(p),rank=sc>=85?'S':sc>=65?'A':'B',prev=save.cases[c.id];
  const res={score:sc,rank,hints:p.hints,sec:Math.round((Date.now()-p.t0)/1000),first:!prev};
  if(!prev||sc>prev.score)save.cases[c.id]={score:sc,rank};persist();track('solve',res);verdict(c,res)}

/* ---------- verdict ---------- */
function verdict(c,res){
  stopPlay();const s=save.cases[c.id],i=CASES.indexOf(c),nx=CASES.find((x,n)=>n>i&&!save.cases[x.id])||CASES.find(x=>!save.cases[x.id]);
  $('#verdict').innerHTML=`
  <div class="topbar"><button class="ghost" id="vback">← 목록</button><h2><span class="mono">${c.no} · 사건 보고서</span><br>${esc(c.name)}</h2></div>
  <div class="verdict">
    <div class="plate"><div class="seal"><div><span>${s.rank}</span><em>해결</em></div></div><img src="${c.img}" alt="${esc(c.work)}">
      <b>${esc(c.work)}</b><small>${esc(c.artist)} · ${c.year}</small><small>${esc(c.place)}</small></div>
    <div class="report">
      <h2>${res?'사건 해결':'사건 보고서'}</h2>
      ${res?`<div class="scoreline"><span>점수 <b>${res.score}</b></span><span>시간 <b>${Math.floor(res.sec/60)}분 ${res.sec%60}초</b></span><span>힌트 <b>${res.hints}회</b></span><span>${res.first?'도감에 <b>새 카드</b> 등록':`최고 기록 <b>${s.score}</b>`}</span></div>`:''}
      <div class="entry"><span class="mono">사건의 전말</span><p>${esc(c.reveal)}</p></div>
      <div class="entry"><span class="mono">아직 풀리지 않은 것</span><p>${esc(c.open)}</p></div>
      <div class="entry look"><span class="mono">이 그림 보는 순서</span><ol>${c.steps.map(t=>`<li>${esc(t)}</li>`).join('')}</ol></div>
      <div class="entry"><span class="mono">찾은 단서</span><p>${c.clues.map(k=>esc(k.title)).join(' · ')}</p></div>
      <div class="row">${nx?`<button class="btn" id="next">다음 사건: ${esc(nx.name)}</button>`:''}<button class="ghost" id="again">다시 수사</button></div>
    </div>
  </div>`;
  $('#vback').onclick=home;$('#again').onclick=()=>play(c.id);if(nx)$('#next').onclick=()=>play(nx.id);
  show('verdict');
}

/* ---------- drifting dust in the gallery light ---------- */
function motes(){
  const cv=$('#motes');if(!cv||matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  const g=cv.getContext('2d');let w=0,h=0;
  const ps=Array.from({length:46},()=>({x:Math.random(),y:Math.random(),r:.5+Math.random()*1.5,v:.00018+Math.random()*.0005,p:Math.random()*6.28,a:.12+Math.random()*.32}));
  (function loop(t){
    if(!cv.isConnected)return;
    const r=cv.getBoundingClientRect();if(r.width!==w||r.height!==h){w=cv.width=r.width;h=cv.height=r.height}
    g.clearRect(0,0,w,h);
    for(const p of ps){p.y-=p.v;p.x+=Math.sin(t/2600+p.p)*.00022;if(p.y<-.02){p.y=1.02;p.x=Math.random()}
      g.globalAlpha=p.a*(.6+.4*Math.sin(t/1300+p.p));g.fillStyle='#ffe9bd';g.beginPath();g.arc(p.x*w,p.y*h,p.r,0,6.28);g.fill()}
    raf=requestAnimationFrame(loop)})(0);
}
/* deep links for shorts descriptions: #scene=note opens a one-scene hunt, #case=scream opens a case */
(()=>{const h=new URLSearchParams(location.hash.slice(1)),sc=h.get('scene'),cs=h.get('case');
  if(sc&&SCENES.some(x=>x.id===sc))scene(sc);else if(cs&&CASES.some(x=>x.id===cs))play(cs);else home()})();
</script>
